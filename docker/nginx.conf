server {
  listen 80;
  server_name _;
  resolver 127.0.0.11 valid=30s ipv6=off;
  proxy_connect_timeout 3s;
  proxy_read_timeout 60s;
  proxy_send_timeout 60s;

  location @api_unavailable {
    default_type application/json;
    return 503 '{"code":"API_UNAVAILABLE","message":"The application server is temporarily unavailable"}';
  }

  location /api/ {
    # Allow the API's 64 MiB file limit plus multipart overhead.
    client_max_body_size 65m;

    set $api_upstream api:3000;
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_intercept_errors on;
    error_page 502 504 = @api_unavailable;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    set $web_upstream web:3001;
    proxy_pass http://$web_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
